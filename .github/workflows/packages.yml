name: package updates
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
permissions:
  contents: write
concurrency:
  group: maintenance-updates
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Reject non-default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$REF" = "refs/heads/$DEFAULT_BRANCH"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: Capture base
        id: base
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .rev VERSION.json)" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@18cf96c7c98e048e10a83abd92116114cd8504be # v14
        with:
          name: pi
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Generate update
        run: nix run .#sync --accept-flake-config
      - name: Check generated paths
        run: bash .github/scripts/publish-update.sh check package
      - name: Run security scans
        run: nix run .#scan --accept-flake-config
      - name: Build packages
        run: |
          nix build path:.#coding-agent --no-link --accept-flake-config
          nix build path:.#coding-agent-bun --no-link --accept-flake-config
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
          BASE: ${{ steps.base.outputs.sha }}
          PREVIOUS_VERSION: ${{ steps.base.outputs.version }}
        run: |
          gh auth setup-git
          bash .github/scripts/publish-update.sh publish package
